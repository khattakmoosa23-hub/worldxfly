<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldsFly Auth</title>
    <link rel="stylesheet" href="style.css">
    <!-- Turnstile API -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

    <!-- Top Nav -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="https://worldsfly.com/assets/worldsfly-logo.png" alt="WorldsFly Logo" class="logo-img">
            </a>
            <nav class="nav-links">
                <a href="about/index.html">About Us</a>
                <a href="contact/index.html">Contact Us</a>
                <a href="javascript:void(0)" class="login-link" onclick="navigateTo('loginCard')">Log In</a>
                <a href="javascript:void(0)" class="btn-get-started" onclick="navigateTo('signupCard')">Get Started</a>
            </nav>
        </div>
    </header>

    <!-- Logo -->
    <div class="logo-container">
        <img src="https://worldsfly.com/assets/worldsfly-logo.png" alt="WorldsFly Logo" class="wf-official-logo">
    </div>

    <!-- 1. LOGIN CARD WITH CAPTCHA -->
    <!-- 1. LOGIN CARD -->
<div class="card" id="loginCard">
    <h2>Login</h2>
    <form onsubmit="handleLogin(event);">
        <div class="form-group">
            <label>Email</label>
            <input type="email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
                <input type="password" id="loginPass" required>
                <span class="toggle-eye" onclick="togglePassword('loginPass')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </span>
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="remember">
            <label for="remember">Remember me</label>
        </div>

        <!-- 1. FORGOT LINK & LOG IN BUTTON PEHLE -->
        <div class="actions-right margin-top-20">
            <a href="javascript:void(0)" class="forgot-link" onclick="navigateTo('forgotCard')">Forgot your password?</a>
            <button type="submit" class="btn-dark">LOG IN</button>
        </div>

        <!-- 2. CAPTCHA USKE NICHE -->
        <div class="cf-turnstile margin-top-20" data-sitekey="0x4AAAAAAEL0_BpFQ5jS9nvN" data-theme="light"></div>

        <!-- 3. SIGN UP BUTTON SAB SE LAST ME -->
        <div class="switch-mode margin-top-20">
            <button type="button" class="btn-outline" onclick="navigateTo('signupCard')">Sign Up</button>
        </div>
    </form>
</div>

    <!-- 2. FORGOT PASSWORD CARD -->
    <div class="card hidden" id="forgotCard">
        <p class="info-text">Forgot your password? No problem. Just let us know your email address and we will email you a password reset link that will allow you to choose a new one.</p>
        <form onsubmit="event.preventDefault();">
            <div class="form-group">
                <label>Email</label>
                <input type="email" required>
            </div>

            <div class="actions-right margin-top-20">
                <button type="submit" class="btn-dark full-width">EMAIL PASSWORD RESET LINK</button>
            </div>

            <div class="switch-mode margin-top-20">
                <button type="button" class="btn-outline" onclick="navigateTo('loginCard')">Back to Login</button>
            </div>
        </form>
    </div>

    <!-- 3. SIGN UP CARD WITH CAPTCHA AT BOTTOM -->
    <div class="card hidden" id="signupCard">
        <h2>Sign Up</h2>
        <form onsubmit="handleSignup(event);">
            <div class="form-group">
                <label>Name</label>
                <input type="text" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="signupPass" required>
                    <span class="toggle-eye" onclick="togglePassword('signupPass')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="signupConfirmPass" required>
                    <span class="toggle-eye" onclick="togglePassword('signupConfirmPass')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
            </div>

            <!-- REGISTER BUTTON & LINK PEHLE -->
            <div class="actions-right margin-top-20">
                <a href="javascript:void(0)" class="forgot-link" onclick="navigateTo('loginCard')">Already registered?</a>
                <button type="submit" class="btn-dark">REGISTER</button>
            </div>

            <!-- CAPTCHA NICHE -->
            <div class="cf-turnstile margin-top-20" data-sitekey="0x4AAAAAAEL0_BpFQ5jS9nvN" data-theme="light"></div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
